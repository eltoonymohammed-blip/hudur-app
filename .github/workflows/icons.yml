name: add-icons
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write icons and push
        run: |
          echo '' | base64 -d > icon-192.png
          echo '' | base64 -d > icon-512.png
          echo '' | base64 -d > icon-512-maskable.png
          git config user.email '361775616+eltoonymohammed-blip@users.noreply.github.com'
          git config user.name 'hudur app setup'
          git add icon-192.png icon-512.png icon-512-maskable.png
          git commit -m 'Add PWA icons'
          git push
