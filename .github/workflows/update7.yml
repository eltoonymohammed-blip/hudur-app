name: update7
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update7.yml'
permissions:
  contents: write
jobs:
  u:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: patch
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
          sed -i "s/hudur-v8-makeup/hudur-v9-qrsheet/" sw.js
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add index.html sw.js
          git commit -m "Visible QR sheet, direct barcode print, print CSS"
          git push
