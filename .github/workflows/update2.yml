name: update2
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update2.yml'
permissions:
  contents: write
jobs:
  u:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: patch
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
          sed -i "s/hudur-v3-pwa-1/hudur-v4-late/" sw.js
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add index.html sw.js
          git commit -m "Lateness minutes in reports, move student between groups"
          git push
