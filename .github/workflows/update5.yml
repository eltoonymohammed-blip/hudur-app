name: update5
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update5.yml'
permissions:
  contents: write
jobs:
  u:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: patch
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
          sed -i "s/hudur-v6-print/hudur-v7-qrprint/" sw.js
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add index.html sw.js
          git commit -m "Add barcode printing with names"
          git push
