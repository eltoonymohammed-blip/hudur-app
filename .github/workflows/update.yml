name: update-app
on:
  push:
    paths:
      - '.github/workflows/update.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write files
        run: |
          echo "" | base64 -d | tar xz
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add index.html sw.js
          git commit -m "Update app: group schedules and check-in time" || echo nothing
          git push
